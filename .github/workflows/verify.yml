name: Verify Meridian
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # Includes the first source build of the MinIO integration-test image.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Anything that ships must be clean, so this gate blocks the build.
      - name: Audit production dependencies
        run: npm audit --audit-level=moderate --omit=dev
      # Reported but not blocking. The braces stack-exhaustion advisory
      # (GHSA-vfj7-8cjw-p6xm) affects every published version, so no override can
      # resolve it, and it reaches this project only through eslint-config-next's
      # glob matching at lint time. Revisit when braces publishes a fix.
      - name: Audit development dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
