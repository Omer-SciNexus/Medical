name: meridian
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian_owner
      POSTGRES_PASSWORD: local-owner-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_owner -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: meridian-local
      MINIO_ROOT_PASSWORD: local-object-store-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
  redis_data:
  minio_data:
